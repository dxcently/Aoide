[package]
name = "aoide-door"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# A doctest is a separate crate that no clippy run lints; no member runs them.
doctest = false

[features]
# The fake `eidolon web` (src/fake.rs), for this crate's tests and later crates'.
fake = []

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints.rust]
# The desktop workspace forbade this for the door; core has no workspace
# lints table, so the door keeps its own forbid.
unsafe_code = "forbid"
