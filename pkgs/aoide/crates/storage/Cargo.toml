[package]
name = "aoide-storage"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Aoide durable session data: stage-file records, atomic stage I/O, the a2a roster, time."

[lib]
name = "aoide_storage"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
aoide-protocol = { workspace = true }
libc = { workspace = true }
# `identity` — the pairing workstream's instance keypair (P-P1,
# docs/architecture/PAIRING.md). See the workspace Cargo.toml's own
# comment for the version/feature reasoning; this crate is the sanctioned
# dependent, per that comment's "consumer" note.
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
# `pairing` — the P-P2 ceremony's SAS transcript hash (`docs/architecture/
# PAIRING.md` decision 1 names `sha2` explicitly). Same sanctioned-break
# scope as `ed25519-dalek`/`getrandom` above — see the workspace
# Cargo.toml's own comment.
sha2 = { workspace = true }
# `seal` — the P-SEAL mail-sealing container and the signed age key
# binding (`docs/architecture/HTTPS-MESH-API.md`, MAIL.md's P-SEAL slice).
# The ONLY dependent of the workspace's `age` entry; see that entry's own
# comment for the version/feature reasoning, the measured weight and the
# third-sanctioned-break note. Every `age` use in this workspace lives in
# `seal.rs`.
age = { workspace = true }
# `config` — the portable runtime config file (task #135 P-C,
# `$AOIDE_ROOT/config.toml`). `toml` reads it into the typed schema,
# `toml_edit` rewrites one key in place so `aoide config set` keeps an
# operator's comments; see the workspace Cargo.toml's own comment for the
# split and the pure-Rust closure note.
toml = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
# The commands tests share the workspace rig (scratch dirs, EnvSaver,
# `env_lock`) — dev-only edge.
aoide-test-support = { workspace = true }

# The native half of `fs` (the stage/state lock, the no-clobber rename, the
# link-preserving copy) and of `display`'s hostname read; only Windows needs
# these APIs. The private-file/directory policy itself is NOT here — it is
# `aoide-protocol::owner_only`, exposed from the leaf crate rather than
# copied (`pkgs/aoide/crates/AGENTS.md`: no cross-crate copying), so this
# crate's own Windows surface stays the narrow set below.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
] }
