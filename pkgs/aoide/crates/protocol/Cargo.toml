[package]
name = "aoide-protocol"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Aoide's one-schema-N-doors contract: registry, Outcome envelope, Door + audit, canonical_state."

[lib]
name = "aoide_protocol"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Minimal feature set for the interactive prompt substrate (ONBOARD.md
# decision 9): crossterm is the terminal backend inquire needs to render
# anything at all on a tty; macros/one-liners/fuzzy are all convenience
# surfaces this crate's Select/MultiSelect/Confirm/Password usage doesn't
# touch (no fuzzy-filtered lists, no one-line compact rendering, no
# prompt! macros), so they stay off.
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }

# Native feed permissions, file identity and EOF writes; only Windows needs these APIs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
