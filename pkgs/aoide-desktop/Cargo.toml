# The aoide-desktop workspace: its own lock, never a member of pkgs/aoide's
# workspace. The requirements are pkgs/aoide/Cargo.toml's, except sha2: this
# workspace pins 0.10, where pkgs/aoide pins 0.11.
[workspace]
resolver = "2"
members = ["crates/door", "crates/exec", "crates/shell"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"

# A forbid cannot be lifted by an attribute (E0453), so these hold in every
# member but exec, which allows them in its own table.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_methods = "forbid"
disallowed_types = "forbid"
