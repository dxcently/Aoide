# The aoide-desktop workspace: its own lock, never a member of pkgs/aoide's
# workspace. The requirements are pkgs/aoide/Cargo.toml's.
[workspace]
resolver = "2"
members = ["crates/door", "crates/shell"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
