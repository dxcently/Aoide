[package]
name = "aoide-desktop-shell"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# The fake `aoide` and fake `eidolon` (src/bin), for this crate's tests only,
# and the fakes of the door and exec crates they run on.
fakes = ["aoide-desktop-door/fake", "aoide-desktop-exec/fakes"]

[[bin]]
name = "fake-aoide"
path = "src/bin/fake-aoide.rs"
required-features = ["fakes"]

[[bin]]
name = "fake-eidolon"
path = "src/bin/fake-eidolon.rs"
required-features = ["fakes"]

[dependencies]
aoide-desktop-door = { path = "../door" }
aoide-desktop-exec = { path = "../exec" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
