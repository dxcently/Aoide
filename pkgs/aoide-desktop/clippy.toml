# The desktop gate's clippy run. A call through an alias of any path below
# fails it. exec.rs holds the one allow for these lints.
disallowed-types = [
    { path = "std::process::Command", reason = "only exec.rs starts a process" },
]
disallowed-methods = [
    { path = "std::process::Command::new", reason = "only exec.rs starts a process" },
    { path = "std::os::unix::process::CommandExt::pre_exec", reason = "only exec.rs runs code between fork and exec" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "only exec.rs replaces a process image" },
    { path = "std::process::Child::kill", reason = "it sends the uncatchable signal; a child is signalled through exec.rs" },
    { path = "libc::fork", reason = "only exec.rs forks" },
    { path = "libc::vfork", reason = "only exec.rs forks" },
    { path = "libc::execv", reason = "only exec.rs replaces a process image" },
    { path = "libc::execve", reason = "only exec.rs replaces a process image" },
    { path = "libc::execvp", reason = "only exec.rs replaces a process image" },
    { path = "libc::execl", reason = "only exec.rs replaces a process image" },
    { path = "libc::execle", reason = "only exec.rs replaces a process image" },
    { path = "libc::execlp", reason = "only exec.rs replaces a process image" },
    { path = "libc::system", reason = "only exec.rs starts a process" },
    { path = "libc::popen", reason = "only exec.rs starts a process" },
    { path = "libc::posix_spawn", reason = "only exec.rs starts a process" },
    { path = "libc::posix_spawnp", reason = "only exec.rs starts a process" },
    { path = "libc::kill", reason = "only exec.rs sends a signal" },
    { path = "libc::setsid", reason = "only exec.rs starts a session" },
    { path = "libc::syscall", reason = "only exec.rs makes a raw syscall" },
    { path = "libc::killpg", reason = "only exec.rs sends a signal" },
    { path = "libc::tgkill", reason = "only exec.rs sends a signal" },
    { path = "libc::sigqueue", reason = "only exec.rs sends a signal" },
    { path = "libc::pthread_kill", reason = "only exec.rs sends a signal" },
    { path = "libc::clone", reason = "only exec.rs forks" },
    { path = "libc::daemon", reason = "only exec.rs starts a process" },
    { path = "libc::execveat", reason = "only exec.rs replaces a process image" },
    { path = "libc::fexecve", reason = "only exec.rs replaces a process image" },
    { path = "libc::execvpe", reason = "only exec.rs replaces a process image" },
]
